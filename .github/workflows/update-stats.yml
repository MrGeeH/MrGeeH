name: Atualizar cards do README

on:
  schedule:
    - cron: "17 6 * * *"   # todo dia às 03:17 (horário de Brasília)
  workflow_dispatch:        # permite rodar manualmente pela aba Actions
  push:
    branches: [main]
    paths:
      - .github/workflows/update-stats.yml

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Se você criar o secret GH_STATS_TOKEN (PAT com escopos repo + read:user),
      # os repositórios privados entram na contagem. Sem ele, usa o token padrão (só públicos).

      - name: Card de estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true   # se falhar, mantém o SVG anterior em vez de quebrar
        with:
          card: stats
          options: username=MrGeeH&show_icons=true&theme=dracula&include_all_commits=true&count_private=true&locale=pt-br
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true     # não grava o card de "Something went wrong"

      - name: Card de linguagens
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: top-langs
          options: username=MrGeeH&layout=compact&theme=dracula&langs_count=8&locale=pt-br
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Gráfico de contribuições
        uses: Platane/snk/svg-only@v3
        continue-on-error: true
        with:
          github_user_name: MrGeeH
          outputs: |
            profile/snake.svg
            profile/snake-dark.svg?palette=github-dark

      - name: Commit dos cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: atualiza cards do README" || exit 0
          git push
